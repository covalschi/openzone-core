# Переносна половина профілю для dayz-agentic-modding-mcp.
# Машинні шляхи живуть у dayz-mcp.local.toml, який не комітиться.

[project]
name = "openzone-core"

[build]
# Ядро — pbo плюс НЕОБОВ'ЯЗКОВА вкладка VPP окремим pbo: у вкладки жорстка
# залежність від VPP (requiredAddons), і нести її в ядрі означало б вимагати
# VPP від кожного сервера. Джерела в <root>/OpenZone_Core і <root>/OpenZone_VPP.
#
# Ядро володіє лише Settings.json. Profiles.json (профілі пристроїв) належить
# КПК: конфіг-служба тут, а самі файли оголошує той мод, якому вони потрібні.
mods = ["OpenZone_Core", "OpenZone_Factions", "OpenZone_VPP", "OpenZone_Factions_PDA", "OpenZone_Factions_VPP"]

[expect]
# Рядок, який ядро друкує, коли всі його конфіги прочитані.
ready_line   = "core loaded"
max_warnings = 0
forbid       = ["Bad type", "Can't compile", "NULL pointer to instance"]
# ДВА ШАБЛОНИ, І ДРУГИЙ ВАЖЛИВІШИЙ.
#
# Перший ловить помилки РУШІЯ про наші класи -- рядки виду `SCRIPT (E)`.
# Другий ловить помилки, які друкує САМ МОД (OZ_Log.Error), і без нього вони
# не бачив вердикт ЖОДНОГО разу: OZ_Log.Error пише звичайним `SCRIPT :` із
# префіксом `[OpenZone] ERROR:`, під `SCRIPT\s+\(E\)` це не підпадає.
#
# Знайдено 2026-09-01: файл гравця не розібрався, ядро чесно написало
# `[OpenZone] ERROR: read ... corrupt config ... kept at ...`, поклало копію
# в карантин -- а вердикт відповів `pass`, 0 помилок. Тобто саме ті відмови,
# заради яких логер і має рівень Error, були невидимі.
error_regex  = ["SCRIPT\\s+\\(E\\).*OZ_", "\\[OpenZone\\] ERROR"]
# Стенд ходить до моста по http на 127.0.0.1, і ядро чесно попереджає про це
# кожен бут. На локальному стенді це стан, а не подія: без цього рядка
# max_warnings = 0 робить вердикт вічно червоним і ховає справжні попередження.
# У проді Bridge.Url мусить бути https -- тоді попередження зникне саме.
# Той самий рядок стоїть у профілі КПК, і з тієї ж причини.
noise        = ["Bridge.Url is not https"]

[expect.counters]
# Знято з реального бута 2026-09-01. Ядро саме адмінів не має -- лічильник
# показує довжину AdminIds із Settings.json стенду, а там від 2026-08-26
# лежить Steam64 власника. До того тут стояв 0, знятий 2026-08-24 з порожнього
# списку, і кожен бут відтоді валив вердикт на цьому одному числі.
admins = 1

[client]
# The client runs with -filePatching and mod_build keeps @<Mod>/<Mod> as a junction
# to the source tree, so an edited .layout is read without repacking (the stand
# config already carries allowFilePatching = 1).
file_patching = true
